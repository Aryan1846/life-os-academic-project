name: Import audited Life OS source
on:
  push:
    paths:
      - .github/workflows/import-source.yml
jobs:
  import:
    if: github.repository == 'Aryan1846/life-os-academic-project'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract source and remove temporary import files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          root = Path.cwd().resolve()
          package = root / 'life-os-source.zip'
          with ZipFile(package) as archive:
              for item in archive.infolist():
                  target = (root / item.filename).resolve()
                  if not target.is_relative_to(root):
                      raise ValueError('Unsafe archive path')
              archive.extractall(root)
          package.unlink()
          (root / '.github/workflows/import-source.yml').unlink()
          PY
      - name: Commit imported project
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import audited Life OS project and presentation'
          git push origin HEAD:main
